site_name: CDL — Compile your business specifications
site_description: An open-source semantic specification compiler for Spec-Driven Development and AI-assisted software engineering.
site_author: Pulsaride Team
site_url: https://pulsaride.github.io/cdl-lang/

repo_name: pulsaride/cdl-lang
repo_url: https://github.com/pulsaride/cdl-lang

nav:
  - Home: index.md
  - Getting Started: quickstart.md
  - Concepts: concepts.md
  - Language:
      - v0.6 Reference: spec.md
      - CLI and Java API: api.md
      - Diagnostics: diagnostics.md
  - Architecture:
      - Compiler Architecture: architecture.md
      - Semantic IR: sir.md
      - Supported Capabilities: capabilities.md
  - SDD and AI:
      - SDD Integration: sdd-integration.md
      - AI-Assisted Authoring: ai-authoring.md
  - Modernization:
      - Overview: modernization.md
      - Java: java-modernization.md
      - TM1: tm1-modernization.md
  - Examples: examples.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
